{% extends "base.html" %}
{% block title %}Change password · QF-gate{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:40px auto">
  <h2>Change your password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn primary" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
